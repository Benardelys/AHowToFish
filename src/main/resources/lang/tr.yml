tutorial:
  install:
    step:
      1: "Minecraft Paper 1.21.1+ sürümünü kurun (Java 21 gereklidir)."
      2: "AHowToFish-1.0.0.jar dosyasını sunucunuzun 'plugins' klasörüne yükleyin."
      3: "Sunucuyu başlatarak varsayılan dosya ve yapılandırmaların oluşmasını sağlayın."
      4: "config.yml dosyasını yapılandırın (seviye formülleri, hazineler ve ödüller)."
      5: "database.yml dosyasını yapılandırın (Tek sunucu için SQLite, ağlar için MySQL/MariaDB)."
      6: "İsteğe bağlı eklentileri yükleyin (Ekonomi için Vault, PlaceholderAPI, WorldGuard)."
      7: "fish.yml ve rarities.yml dosyalarını sunucunuza göre dengeleyin."
      8: "/ahowtofish zone setpos1 ve setpos2 komutları ile özel balıkçılık bölgeleri oluşturun."
      9: "Yetkileri yapılandırın (oyunculara ahowtofish.use ve ahowtofish.menu yetkilerini verin)."
      10: "Sunucuyu yeniden başlatmadan değişiklikleri uygulamak için /ahowtofish reload yazın."
      11: "Oltanızı suya atarak balıkçılık mekaniklerini oyun içinde test edin."
    footer: "&aKapsamlı yapılandırma kılavuzu için &e/ahowtofish admin tutorial &akullanabilirsiniz."
  admin:
    1:
      title: "&c&l✦ Bölüm 1: Kurulum ve Temel Yapılandırma"
      desc: "Minecraft Paper sunucuları için kapsamlı kurulum kılavuzu."
      details: "JAR dosyasını plugins/ içine atın, sunucuyu açın ve Java 21 uyumluluğunu doğrulayın. Paper 1.21.1+ ve 26.3+ tam desteklenir."
    2:
      title: "&c&l✦ Bölüm 2: Bağımlılıklar ve Entegrasyonlar"
      desc: "Ekonomi, yer tutucu ve bölge koruması için harici eklentileri bağlayın."
      details: "Vault ile nakit satış ve yem alımı açılır. PlaceholderAPI 20'den fazla yer tutucu sağlar. WorldGuard bölgeleri korur."
    3:
      title: "&c&l✦ Bölüm 3: Yapılandırma Dosyaları"
      desc: "Oynanışı, ilerleme eğrilerini ve menüleri özelleştirin."
      details: "config.yml seviye ve çarpanları, database.yml havuz bağlantılarını, gui.yml menü düzenlerini yönetir."
    4:
      title: "&c&l✦ Bölüm 4: Yetkiler ve Güvenlik"
      desc: "Komut yetkilerini güvenceye alın ve yetkisiz yönetimi engelleyin."
      details: "Oyuncular için ahowtofish.use ve ahowtofish.menu. Tüm ahowtofish.admin.* yetkileri varsayılan olarak yalnızca OP'tur."
    5:
      title: "&c&l✦ Bölüm 5: PlaceholderAPI Entegrasyonu"
      desc: "Balıkçılık istatistiklerini tab listesinde, sohbette ve skor tablosunda gösterin."
      details: "%ahowtofish_level%, %ahowtofish_xp%, %ahowtofish_fish_caught%, %ahowtofish_total_weight%, %ahowtofish_largest_fish%."
    6:
      title: "&c&l✦ Bölüm 6: Özel İçerik Oluşturma"
      desc: "Özel balıklar, oltalar, yemler ve 3D balıkçılık bölgeleri tasarlayın."
      details: "fish.yml ile balık ekleyin. rods.yml ile oltaları güçlendirin. /ahowtofish zone create ile yeni yaşam alanları kurun."
    7:
      title: "&c&l✦ Bölüm 7: Görevler, Etkinlikler ve Turnuvalar"
      desc: "Turnuvalar, bereket etkinlikleri ve görev sözleşmeleri ile oyuncuları bağlayın."
      details: "quests.yml sözleşmeleri, events.yml Çift XP ve Altın Gelgit'i, competitions.yml otomatik turnuvaları yönetir."
    8:
      title: "&c&l✦ Bölüm 8: Veritabanı ve Dil Ayarları"
      desc: "Çoklu dil yerelleştirmesi ve ağ veritabanı havuzları."
      details: "config.yml içinde default-language: tr veya en olarak ayarlayın. database.yml içinde MySQL/MariaDB HikariCP havuzunu kurun."
  page:
    1:
      title: "&b&l✦ AHowToFish'e Hoş Geldiniz"
      name: "Hoş Geldiniz ve Amaç"
      content: "AHowToFish, standart Minecraft balıkçılığını derin bir RPG deneyimine dönüştüren gelişmiş bir balıkçılık eklentisidir. Eşsiz balıklar yakalayın, görevleri tamamlayın ve kariyerinizde seviye atlayın."
      tips: "/fish veya /fishing yazarak dilediğiniz an ana balıkçılık menüsüne ulaşabilirsiniz!"
    2:
      title: "&b&l✦ Başlangıç Rehberi"
      name: "Olta Atma ve Avlanma"
      content: "Bir olta kuşanın, açık bir su birikintisi bulun ve oltanızı fırlatın. Balığın vurmasını bekleyin ve doğru anda çekerek rastgele ağırlık ve nadirlikteki özel balıkları yakalayın."
      tips: "Özel balıkçılık bölgelerinde avlanmak daha yüksek XP, para bonusu ve egzotik türler kazandırır."
    3:
      title: "&b&l✦ Balık Türleri ve Nadirlikler"
      name: "Nadirlikler ve Ağırlık"
      content: "Toplam 7 nadirlik seviyesi vardır: Yaygın, Sıradan, Nadir, Epik, Efsanevi, Mistik ve Gizemli. Her balığın değeri ve kazandırdığı XP ağırlığına göre hesaplanır."
      tips: "Yüksek nadirlikteki balıklar tutulduğunda sunucu genelinde duyuru geçer ve parçacık efektleri saçar!"
    4:
      title: "&b&l✦ Seviye İlerlemesi"
      name: "Balıkçılık XP ve Aşamalar"
      content: "Yakaladığınız her balık size Balıkçılık XP'si kazandırır. XP kazandıkça seviyeniz yükselir ve yeni balıkçılık bölgelerinin, prestij unvanlarının ve özel oltaların kilidi açılır."
      tips: "İlerleme durumunuzu /fish veya /fish stats komutlarıyla her zaman görebilirsiniz."
    5:
      title: "&b&l✦ Yem Mekanikleri"
      name: "Yemler ve Çarpanlar"
      content: "Balık tutarken sol elinizde (off-hand) özel yem tutarak balık tutma hızını, şansınızı ve nadir balık oranını katlayabilirsiniz. Her yemin belirli bir kullanım ömrü vardır."
      tips: "/fish shop yazarak balık pazarından dilediğiniz zaman yem satın alabilirsiniz."
    6:
      title: "&b&l✦ Özel Balıkçı Oltaları"
      name: "Oltalar ve Yetenekler"
      content: "Özel oltalar bonus XP çarpanı, yüksek şans oranı, çift balık tutma şansı ve seviye gereksinimleri gibi eşsiz pasif güçlere sahiptir."
      tips: "Oltanızı geliştirerek veya usta oltaları edinerek derin seviye bölgelerinde avlanın."
    7:
      title: "&b&l✦ Balık Koleksiyon Günlüğü"
      name: "Koleksiyon ve Rekorlar"
      content: "Keşfettiğiniz her benzersiz balık türü kişisel günlüğünüze kaydedilir. Henüz yakalamadığınız balıklar yakalanana kadar gizemli soru işaretleri ile listelenir."
      tips: "Tüm balık türlerini keşfederek özel başarımların ve para ödüllerinin kilidini açın!"
    8:
      title: "&b&l✦ Görevler ve Sözleşmeler"
      name: "Günlük ve Haftalık Görevler"
      content: "Günlük, haftalık ve kalıcı balıkçılık sözleşmelerini tamamlayarak ekstra para, XP ve nadir hazineler kazanın. Görevler avlarınızı otomatik olarak takip eder."
      tips: "Aktif sözleşmelerinizi /fish quests yazarak görüntüleyebilirsiniz."
    9:
      title: "&b&l✦ Başarımlar ve Prestij"
      name: "Başarımlar ve Unvanlar"
      content: "Büyük balıkçılık başarımlarını tamamlayarak kalıcı unvanların ve ödüllerin kilidini açın. Başarımlar ustalığınızı ve kararlılığınızı ödüllendirir."
      tips: "/fish achievements yazarak tamamlanan ve bekleyen başarımları inceleyin."
    10:
      title: "&b&l✦ Yaşam Alanları ve Bölgeler"
      name: "Balıkçılık Bölgeleri"
      content: "Bazı alanlar özel Balıkçılık Bölgesi olarak belirlenmiştir. Bu bölgeler özel XP ve para çarpanlarına sahiptir ve yerel egzotik balık türlerine ev sahipliği yapar."
      tips: "Bir bölgede balık tutmadan önce gereken seviye şartını karşıladığınızdan emin olun!"
    11:
      title: "&b&l✦ Turnuvalar ve Yarışmalar"
      name: "Yarışmalar ve Sıralamalar"
      content: "Otomatik balık turnuvalarına katılın! En çok balık, en büyük av veya nadir türler için diğer oyuncularla yarışın. Canlı lider tablosu BossBar'da görünür."
      tips: "Süre bittiğinde ilk üçe giren balıkçılar devasa para ve hazine ödülleri kazanır."
    12:
      title: "&b&l✦ Süreli Sunucu Etkinlikleri"
      name: "Özel Etkinlikler"
      content: "'Altın Gelgit' veya 'Çift XP Fırtınası' gibi sunucu etkinlikleri dönemsel olarak başlar ve katlanmış kazanç fırsatları sunar."
      tips: "Kazancınızı maksimize etmek için sohbet ve BossBar duyurularını takip edin!"
    13:
      title: "&b&l✦ Balık Satışı ve Ekonomi"
      name: "Balık Pazarı"
      content: "Tuttuğunuz balıkları kazanca dönüştürün! Elinizdeki balığı satmak için /fish sell, envanterinizdeki tüm balıkları satmak için /fish sellall kullanın."
      tips: "Tüm satışlar eşya kaybı veya hatalara karşı atomik kilitler ile korunur."
    14:
      title: "&b&l✦ Menüler ve Kolay Erişim"
      name: "Kullanışlı Komutlar"
      content: "Tüm özelliklere tek komutla erişin: /fish (Ana Menü), /fish stats (İstatistikler), /fish collection (Günlük), /fish shop (Pazar) ve /fish quests (Görevler)."
      tips: "Tüm menülerde kolay gezinme için geri dönüş butonları mevcuttur."
    15:
      title: "&b&l✦ Çoklu Dil Ayarları"
      name: "Dil Tercihi"
      content: "AHowToFish Türkçe ve İngilizce dillerini dinamik dil değiştirme ile destekler. Kişisel dilinizi ayarlamak için /fish language yazabilirsiniz."
      tips: "/fish language default yazarak sunucunun varsayılan dilini kullanmaya devam edebilirsiniz."
    16:
      title: "&b&l✦ Yardım ve Destek"
      name: "Komut Yardımı"
      content: "Yardıma mı ihtiyacınız var? /ahowtofish help yazarak tüm oyuncu ve yönetici komutlarını, yetkilerini ve sözdizimini görüntüleyin."
      tips: "Sunucu yöneticileri kurulum için /ahowtofish admin tutorial komutunu çalıştırabilir!"

