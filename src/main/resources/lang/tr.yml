quest_translations:
  first-rod:
    name: "İskeleye Hoş Geldin"
    desc:
      - "İskeledeki Balıkçı Lucas ile konuş"
      - "ve başlangıç oltanı teslim al."
    offer: "Aha, yeni bir yüz! Al bakalım şu oltayı. Neler yapabildiğini görelim!"
    progress: "Başlangıç oltanı teslim almak için bana sağ tıkla."
    complete: "Güzel iş! Sağlam bir olta balıkçının en sadık dostudur."
  cast-your-line:
    name: "Oltanı Fırlat"
    desc:
      - "Oltanı 3 kez suya fırlatarak atış tekniğini öğren."
    offer: "Suya doğru yanaş ve oltanı 3 kez savur. Oltanın gerilimini hisset!"
    progress: "Şamandıranı suya {current}/{required} kez fırlat."
    complete: "Mükemmel bir atış tekniği! Doğuştan balıkçısın sen."
  first-catch:
    name: "İlk Avın"
    desc:
      - "Sudan ilk balığını yakala."
    offer: "Sudaki dalgaları dikkatle izle. Şamandıra batınca anında çek! İlk balığını yakala."
    progress: "Sabırla bir ısırık bekle ve 1 balık yakala."
    complete: "Vay canına, şuna bak! Ne muazzam bir balık!"
  return-lucas:
    name: "Lucas'a Dön"
    desc:
      - "Tuttuğun balıkla Balıkçı Lucas'a geri dön ve konuş."
    offer: "Tuttuğun balığı hemen bana getir, pullarını bir inceleyeyim!"
    progress: "İskeledeki Balıkçı Lucas'a sağ tıkla."
    complete: "Şu yüzgeçlerin parlaklığına bak! Pazar ticaretini öğrenmeye hazırsın."
  sell-first-fish:
    name: "Tüccar Takası"
    desc:
      - "Tuttuğun balığı Balıkçı Lucas'a satarak altın kazan."
    offer: "Pazar tezgahımı aç ve bana taze balığını sat. Her balıkçının kesesinde altın olmalı!"
    progress: "Lucas Balık Pazarı menüsünde en az 1 balık sat."
    complete: "Helalinden kazandın! Daha büyük seferler için balık satmaya devam et."
  reach-level-2:
    name: "Yükselen Balıkçı"
    desc:
      - "Balık tutarak XP kazan ve Seviye 2 Balıkçı ol."
    offer: "Balık tutmaya ve tekniğini geliştirmeye devam et, 2. Seviyeye ulaş."
    progress: "Seviye 2'ye ulaş (Mevcut Seviye: {current})."
    complete: "Daha şimdiden Seviye 2 mi?! Balıkçılık camiasında adın duyulmaya başladı bile!"
  rare-fish:
    name: "Nadirlik Avı"
    desc:
      - "En az UNCOMMON (Sıradışı) veya üstü nadirlikte 1 balık yakala."
    offer: "Sıradan sazanlar iyidir ama gerçek şan derin sularda yatar. Sıradışı veya daha iyi bir balık yakala!"
    progress: "1 adet Sıradışı+ balık yakala."
    complete: "Muazzam! Bu nadirlikte bir av iskelede çok iyi para eder."
  upgrade-gear:
    name: "Ustalık Adımları"
    desc:
      - "Dükkandan özel yem satın al ve balık tutarken kullan."
    offer: "Fırtınalı açık denizleri fethetmek için özel yemlere ihtiyacın var. Oltana yem tak ve kullan!"
    progress: "Balık tutarken özel bir yem kullan."
    complete: "Tüm temel esasları öğrendin evlat! Artık dünya denizleri senin önünde eğilsin."

