tutorial:
  install:
    step:
      1: "Install Minecraft Paper 1.21.1+ (Java 21 required)."
      2: "Place AHowToFish-1.0.0.jar into your server's 'plugins' folder."
      3: "Start the server to generate default configurations and resources."
      4: "Configure config.yml (leveling formulas, treasure drops, rewards)."
      5: "Configure database.yml (SQLite for standalone, or MySQL/MariaDB for networks)."
      6: "Install optional dependencies (Vault for economy, PlaceholderAPI, WorldGuard)."
      7: "Customize fish.yml and rarities.yml to balance your catches."
      8: "Create custom fishing zones using /ahowtofish zone setpos1 and setpos2."
      9: "Configure permissions (grant ahowtofish.use, ahowtofish.menu to players)."
      10: "Execute /ahowtofish reload to apply changes without restarting."
      11: "Cast your fishing rod and verify fishing mechanics in-game."
    footer: "&aUse &e/ahowtofish admin tutorial &afor deep configuration guides."
  admin:
    1:
      title: "&c&l✦ Section 1: Installation & Setup"
      desc: "Comprehensive installation guide for Minecraft Paper servers."
      details: "Place the JAR inside plugins/, start the server, and verify Java 21 compatibility. Supported on Paper 1.21.1+ and 26.3+."
    2:
      title: "&c&l✦ Section 2: Dependencies & Integrations"
      desc: "Integrate optional external plugins for economy, placeholders, and regions."
      details: "Vault enables cash sales and bait purchases. PlaceholderAPI provides 20+ placeholders. WorldGuard protects fishing zones."
    3:
      title: "&c&l✦ Section 3: Configuration Files"
      desc: "Customize gameplay, progressions, formulas, and visual menus."
      details: "Edit config.yml for level curves and multipliers. database.yml manages pool connections. gui.yml customizes inventories."
    4:
      title: "&c&l✦ Section 4: Permissions & Security"
      desc: "Secure command nodes and prevent unauthorized administration."
      details: "ahowtofish.use and ahowtofish.menu for players. All ahowtofish.admin.* nodes default to OP/false to prevent permission bypass."
    5:
      title: "&c&l✦ Section 5: PlaceholderAPI Integration"
      desc: "Display fishing statistics on scoreboards, tablists, and chat."
      details: "%ahowtofish_level%, %ahowtofish_xp%, %ahowtofish_fish_caught%, %ahowtofish_total_weight%, %ahowtofish_largest_fish%."
    6:
      title: "&c&l✦ Section 6: Custom Content Creation"
      desc: "Create custom fish, rods, baits, and 3D cuboid fishing zones."
      details: "Add custom fish entries in fish.yml. Define rods with custom perks in rods.yml. Use /ahowtofish zone create for in-game habitats."
    7:
      title: "&c&l✦ Section 7: Quests, Events & Competitions"
      desc: "Engage players with tournaments, frenzy events, and daily contracts."
      details: "Configure quests.yml for contracts. events.yml controls Golden Tide & Double XP. competitions.yml manages automated tournaments."
    8:
      title: "&c&l✦ Section 8: Database & Language Setup"
      desc: "Multi-language localization and network database pooling."
      details: "Set default-language: tr or en in config.yml. Configure HikariCP connection pools in database.yml for MySQL or MariaDB."
  page:
    1:
      title: "&b&l✦ Welcome to AHowToFish"
      name: "Welcome & Objective"
      content: "AHowToFish is an advanced fishing and progression plugin designed to transform vanilla fishing into a rich RPG experience. Catch unique fish, complete quests, unlock perks, and level up your fishing career."
      tips: "Open the main hub menu anytime by typing /fish or /fishing!"
    2:
      title: "&b&l✦ Getting Started"
      name: "Casting & Catching"
      content: "Equip a fishing rod, find any open body of water, and cast your hook. Wait for a bite and reel in at the right moment to catch custom fish species with randomized weights and rarities."
      tips: "Casting in special fishing zones gives higher XP, money bonuses, and exotic species."
    3:
      title: "&b&l✦ Fish Species & Rarities"
      name: "Rarities & Weight"
      content: "There are 7 distinct rarity tiers: Common, Uncommon, Rare, Epic, Legendary, Mythic, and Secret. Every fish has a unique weight, influencing its selling value and XP yield."
      tips: "Higher rarity fish trigger server-wide announcements and sparkle with particle effects!"
    4:
      title: "&b&l✦ Progression & Levels"
      name: "Fishing XP & Milestones"
      content: "Every catch awards Fishing XP. As your XP increases, you level up, unlocking access to advanced fishing zones, prestigious title rewards, and elite rods."
      tips: "Check your progress path anytime in /fish or /fish stats."
    5:
      title: "&b&l✦ Bait Mechanics"
      name: "Baits & Multipliers"
      content: "Hold custom bait in your off-hand while fishing to increase bite frequency, luck, and rare catch rates. Each bait has a specific durability of uses."
      tips: "Purchase extra bait in the market shop using /fish shop."
    6:
      title: "&b&l✦ Custom Fishing Rods"
      name: "Rods & Abilities"
      content: "Rods have custom perks such as bonus XP multipliers, higher luck rates, increased double catch chance, and requirement levels."
      tips: "Upgrade your rod or purchase master rods to fish in deep end-game zones."
    7:
      title: "&b&l✦ Fish Collection Journal"
      name: "Species Collection"
      content: "Track every discovered fish species in your personal collection journal. Undiscovered fish appear as mystery entries until caught."
      tips: "Earn exclusive achievements and cash bonuses for discovering all species!"
    8:
      title: "&b&l✦ Quests & Contracts"
      name: "Daily & Weekly Missions"
      content: "Complete daily, weekly, and permanent contracts to earn extra money, XP, and rare treasures. Quests automatically track relevant catches."
      tips: "View active contracts anytime by typing /fish quests."
    9:
      title: "&b&l✦ Achievements & Titles"
      name: "Achievements"
      content: "Accomplish major fishing milestones to earn permanent prestige titles and reward payouts. Achievements reward dedication and mastery."
      tips: "Open /fish achievements to inspect completed and pending milestones."
    10:
      title: "&b&l✦ Habitats & Zones"
      name: "Fishing Zones"
      content: "Certain regions are designated as unique Fishing Zones. These habitats possess custom XP and coin multipliers, and harbor exclusive local fish species."
      tips: "Ensure you meet the required fishing level before attempting to fish in a zone!"
    11:
      title: "&b&l✦ Tournaments & Competitions"
      name: "Competitions"
      content: "Join automated fishing competitions! Compete against other players for the most fish caught, largest weight, or rare species. Live rankings display via BossBar."
      tips: "The top 3 anglers receive massive monetary and reward payouts when the timer expires."
    12:
      title: "&b&l✦ Timed Server Events"
      name: "Special Events"
      content: "Random server events like 'Golden Tide' or 'Double XP Frenzy' occur periodically, offering multiplied earnings and elevated rarity chances."
      tips: "Watch the chat and BossBar for event alerts to maximize your catches!"
    13:
      title: "&b&l✦ Selling Fish"
      name: "Fish Market"
      content: "Turn your catches into profit! Use /fish sell to sell the fish held in your hand, or /fish sellall to immediately sell all eligible fish in your inventory."
      tips: "All transactions are secured with atomic locks to prevent item loss or errors."
    14:
      title: "&b&l✦ Menus & Navigation"
      name: "Convenient Commands"
      content: "Access all features effortlessly: /fish (Main Menu), /fish stats (Statistics), /fish collection (Journal), /fish shop (Market), and /fish quests (Contracts)."
      tips: "All menus feature instant back buttons for seamless navigation."
    15:
      title: "&b&l✦ Multi-Language Settings"
      name: "Language Preference"
      content: "AHowToFish supports English and Turkish localization with dynamic language switching. Type /fish language to select your preferred language."
      tips: "You can also use /fish language default to follow the server's configured default language."
    16:
      title: "&b&l✦ Help & Support"
      name: "Command Help"
      content: "Need assistance? Type /ahowtofish help to inspect all available player and administrator commands, permissions, and syntax."
      tips: "Server admins can run /ahowtofish admin tutorial for setup instructions!"

