quest_translations:
  first-rod:
    name: "Welcome to the Docks"
    desc:
      - "Speak with Fisherman Lucas at the pier"
      - "and receive your starter fishing rod."
    offer: "Ahoy, newcomer! Take this starter fishing rod. Let's see what you've got!"
    progress: "Right-click me at the pier to claim your starter rod."
    complete: "Splendid! A sturdy rod is an angler's most faithful companion."
  cast-your-line:
    name: "Cast Your Line"
    desc:
      - "Cast your fishing rod into open water 3 times."
    offer: "Walk over to the water and cast your line 3 times. Feel the rod bend!"
    progress: "Cast your hook into the water {current}/{required} times."
    complete: "Great casting form! You are a natural-born angler."
  first-catch:
    name: "Your First Catch"
    desc:
      - "Catch your very first fish from the water."
    offer: "Watch the water ripples closely. When the bobber dips, pull! Catch your first fish."
    progress: "Wait patiently for a bite and catch 1 fish."
    complete: "Whoa, look at that! What a gorgeous catch!"
  return-lucas:
    name: "Return to Lucas"
    desc:
      - "Bring your fresh catch back to Fisherman Lucas."
    offer: "Bring that fish right over to me so I can inspect those scales!"
    progress: "Right-click Fisherman Lucas at the docks."
    complete: "Look at the shine on those fins! You are ready to learn market trading."
  sell-first-fish:
    name: "Merchant Trade"
    desc:
      - "Sell your caught fish to Fisherman Lucas for coins."
    offer: "Open my market stall and sell me your fresh fish. Every fisherman needs gold in their pouch!"
    progress: "Sell at least 1 fish in Lucas's Fish Market."
    complete: "Honest money for honest work! Keep selling to fund bigger expeditions."
  reach-level-2:
    name: "Rising Angler"
    desc:
      - "Earn fishing XP by catching fish to reach Level 2."
    offer: "Keep fishing and honing your technique to reach Level 2."
    progress: "Reach Fishing Level 2 (Current: {current})."
    complete: "Level 2 already?! Word of your skill will spread across the shores!"
  rare-fish:
    name: "Rarity Hunter"
    desc:
      - "Catch at least 1 UNCOMMON or rarer fish."
    offer: "Common carp are fine, but true glory lies in rarer depths. Reel in an Uncommon or better fish!"
    progress: "Catch 1 Uncommon+ rarity fish."
    complete: "Outstanding! A catch of that rarity fetches a handsome price at the docks."
  upgrade-gear:
    name: "Mastery Steps"
    desc:
      - "Purchase and use specialized bait while fishing."
    offer: "To conquer wild seas you need proper bait. Equip custom bait and use it!"
    progress: "Use custom bait while fishing."
    complete: "You've mastered all the fundamentals, lad! The boundless oceans are yours to conquer."

achievement_translations:
  first_catch:
    name: "First Tug on the Line"
    desc: "Catch your very first fish in AHowToFish."
  century_fisher:
    name: "Century Fisherman"
    desc: "Reel in 100 fish across your career."
  thousand_catches:
